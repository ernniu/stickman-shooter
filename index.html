<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>云端火柴人射击</title>
  </head>
  <body>
    <main id="game" aria-label="Phaser game canvas"></main>
    <script>
      // 移动端兜底：禁止双指缩放、双击缩放与长按菜单，避免打断游戏操作。
      ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
        document.addEventListener(type, (event) => event.preventDefault(), {
          passive: false,
        });
      });
      document.addEventListener(
        'dblclick',
        (event) => event.preventDefault(),
        { passive: false },
      );
      document.addEventListener('contextmenu', (event) =>
        event.preventDefault(),
      );
      // 调试浮层：运行时报错直接显示在画面顶部（便于真机排查，不影响正常流程）
      window.addEventListener('error', (event) => {
        showRuntimeError(event.message);
      });
      window.addEventListener('unhandledrejection', (event) => {
        showRuntimeError(String(event.reason));
      });
      function showRuntimeError(message) {
        let box = document.getElementById('runtime-error');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'runtime-error';
          box.style.cssText =
            'position:fixed;top:0;left:0;right:0;z-index:9999;' +
            'max-height:40%;overflow:auto;margin:0;padding:8px;' +
            'background:rgba(120,0,0,0.85);color:#fff;font-size:12px;' +
            'white-space:pre-wrap;word-break:break-all;';
          document.body.appendChild(box);
        }
        box.textContent += message + '\n';
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
